apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-config
  namespace: togglemaster
data:
  PORT: "8004"
  REDIS_URL: "rediss://YOUR_REDIS_ENDPOINT:6379"
  FLAG_SERVICE_URL: "http://flag-service:8002"
  TARGETING_SERVICE_URL: "http://targeting-service:8003"
  AWS_REGION: "us-east-1"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/YOUR_AWS_ACCOUNT_ID/togglemaster-events-local"
  AWS_STS_REGIONAL_ENDPOINTS: "regional"
