apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: togglemaster
  namespace: togglemaster
spec:
  ingressClassName: nginx
  rules:
    - host: togglemaster.test
      http:
        paths:
          - path: /evaluate
            pathType: Prefix
            backend:
              service:
                name: evaluation-service
                port:
                  number: 8004

          - path: /flags
            pathType: Prefix
            backend:
              service:
                name: flag-service
                port:
                  number: 8002

          - path: /rules
            pathType: Prefix
            backend:
              service:
                name: targeting-service
                port:
                  number: 8003

          - path: /validate
            pathType: Exact
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
